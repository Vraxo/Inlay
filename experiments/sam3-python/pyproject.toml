[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inlay-sam3-experiment"
version = "0.1.0"
description = "Local SAM 3.1 segmentation experiment for Inlay"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<2",
    "Pillow>=10.0",
    "einops>=0.8",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
inlay-sam3 = "inlay_sam3.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["inlay_sam3*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
