[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inlay-sam3-experiment"
version = "0.1.0"
description = "Local SAM 3.1 segmentation experiment for Inlay"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<2",
    "Pillow>=10.0",
    "einops @ https://files.pythonhosted.org/packages/2a/09/f8d8f8f31e4483c10a906437b4ce31bdf3d6d417b73fe33f1a8b59e34228/einops-0.8.2-py3-none-any.whl#sha256=54058201ac7087911181bfec4af6091bb59380360f069276601256a76af08193",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
inlay-sam3 = "inlay_sam3.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["inlay_sam3*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
