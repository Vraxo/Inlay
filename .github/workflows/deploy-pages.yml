name: Deploy Inlay to GitHub Pages
# Publishes the static Blazor WebAssembly app.

on:
  push:
    branches:
      - main
    paths:
      - "src/Inlay.Web/**"
      - "src/Inlay/Detection/**"
      - "src/Inlay/Extraction/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          cache: true
          cache-dependency-path: src/Inlay.Web/Inlay.Web.csproj

      - name: Cache WebAssembly workload
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DOTNET_ROOT }}/packs
            ${{ env.DOTNET_ROOT }}/sdk-manifests
            ${{ env.DOTNET_ROOT }}/metadata/workloads
          key: ${{ runner.os }}-dotnet11-wasm-tools-v1
          restore-keys: |
            ${{ runner.os }}-dotnet11-wasm-tools-

      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools

      - name: Publish browser app
        run: dotnet publish src/Inlay.Web/Inlay.Web.csproj --configuration Release

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/Inlay.Web/bin/Release/net11.0/publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
