name: SAM 3 experiment tests

on:
  push:
    paths:
      - "experiments/sam3-python/**"
      - ".github/workflows/sam3-experiment.yml"
  pull_request:
    paths:
      - "experiments/sam3-python/**"
      - ".github/workflows/sam3-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experiments/sam3-python/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: experiments/sam3-python
      - run: python -m pytest -q
        working-directory: experiments/sam3-python
