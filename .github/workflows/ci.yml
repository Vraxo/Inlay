name: CI

on:
  push:
    branches: [main, "implementation/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inlay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 11 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Restore
        run: dotnet restore Inlay.slnx

      - name: Build
        run: dotnet build Inlay.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Inlay.slnx --configuration Release --no-build --logger "trx;LogFileName=inlay-tests.trx" --results-directory artifacts/test-results

      - name: Publish self-contained Windows x64 CLI
        run: dotnet publish src/Inlay/Inlay.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=embedded --output artifacts/publish/win-x64

      - name: Upload application and test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inlay-${{ github.sha }}-win-x64
          path: |
            artifacts/publish/win-x64/
            artifacts/test-results/
          if-no-files-found: warn
          retention-days: 30
