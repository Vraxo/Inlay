name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - run: dotnet build

      - run: dotnet test --no-build

      - name: Cache WebAssembly workload
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DOTNET_ROOT }}/packs
            ${{ env.DOTNET_ROOT }}/sdk-manifests
            ${{ env.DOTNET_ROOT }}/metadata/workloads
          key: ${{ runner.os }}-dotnet11-wasm-tools-v1
          restore-keys: |
            ${{ runner.os }}-dotnet11-wasm-tools-

      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools

      - name: Build browser app
        run: dotnet build src/Inlay.Web/Inlay.Web.csproj --configuration Release -p:WasmBuildNative=false -p:WasmEnableSIMD=true -p:WasmEnableExceptionHandling=true

  python-sam3-tests:
    name: Python SAM 3 experiment tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experiments/sam3-python/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: experiments/sam3-python
      - run: python -m pytest -q
        working-directory: experiments/sam3-python

  powershell-syntax:
    name: PowerShell script syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse setup and runner scripts
        shell: pwsh
        run: |
          $files = @(
            "experiments/sam3-python/setup.ps1",
            "experiments/sam3-python/setup-gguf.ps1",
            "experiments/sam3-python/setup-python.ps1",
            "experiments/sam3-python/run-gguf.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              exit 1
            }
          }

  native-sam3-windows-build:
    name: Native SAM 3 Windows build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Fetch native GGUF runtime
        run: git clone --recurse-submodules https://github.com/Asher-1/sam3-ggml.git native-sam3
      - name: Configure CPU build
        run: cmake -S native-sam3 -B native-sam3/build -G "Visual Studio 17 2022" -A x64 -DSAM3_CUDA=OFF -DSAM3_METAL=OFF -DSAM3_BUILD_EXAMPLES=ON
      - name: Compile offline segmentation CLI
        run: cmake --build native-sam3/build --config Release --target sam3_vis --parallel 2
