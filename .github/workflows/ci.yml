name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - run: dotnet build

      - run: dotnet test --no-build

      - name: Cache WebAssembly workload
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DOTNET_ROOT }}/packs
            ${{ env.DOTNET_ROOT }}/sdk-manifests
            ${{ env.DOTNET_ROOT }}/metadata/workloads
          key: ${{ runner.os }}-dotnet11-wasm-tools-v1
          restore-keys: |
            ${{ runner.os }}-dotnet11-wasm-tools-

      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools

      - name: Build browser app
        run: dotnet build src/Inlay.Web/Inlay.Web.csproj --configuration Release -p:WasmBuildNative=false -p:WasmEnableSIMD=true -p:WasmEnableExceptionHandling=true

  python-sam3-tests:
    name: Python SAM 3 experiment tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experiments/sam3-python/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: experiments/sam3-python
      - run: python -m pytest -q
        working-directory: experiments/sam3-python

  python-qwen3vl-tests:
    name: Python Qwen 3 VL experiment tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experiments/qwen3-vl/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: experiments/qwen3-vl
      - run: python -m pytest -q
        working-directory: experiments/qwen3-vl

  powershell-syntax:
    name: PowerShell setup syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse setup scripts
        shell: pwsh
        run: |
          $scripts = @(
            "experiments/sam3-python/setup.ps1",
            "experiments/qwen3-vl/setup.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "Parse errors in $script"
              $errors | Format-List
              exit 1
            }
          }
