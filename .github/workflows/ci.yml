name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - run: dotnet build

      - run: dotnet test --no-build

      - name: Cache WebAssembly workload
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DOTNET_ROOT }}/packs
            ${{ env.DOTNET_ROOT }}/sdk-manifests
            ${{ env.DOTNET_ROOT }}/metadata/workloads
          key: ${{ runner.os }}-dotnet11-wasm-tools-v1
          restore-keys: |
            ${{ runner.os }}-dotnet11-wasm-tools-

      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools

      - name: Build browser app
        run: dotnet build src/Inlay.Web/Inlay.Web.csproj --configuration Release -p:WasmBuildNative=false
