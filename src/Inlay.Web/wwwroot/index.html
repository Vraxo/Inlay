<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fafafa" />
    <script>
        (() => {
            const preference = localStorage.getItem("inlay-theme") || "system";
            const dark = preference === "dark" || (preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
            document.documentElement.dataset.theme = dark ? "dark" : "light";
        })();
    </script>
    <base href="./" />
    <title>Inlay — Extract an image</title>
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="Inlay.Web.styles.css" />
</head>
<body>
    <div id="app">
        <div class="boot"><span class="mark"><i></i><i></i><i></i><i></i></span><span>Starting Inlay…</span></div>
    </div>
    <div id="blazor-error-ui">
        Something went wrong. <a href="" class="reload">Reload</a>
        <a class="dismiss">×</a>
    </div>
    <script src="download.js"></script>
    <script src="drop.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
